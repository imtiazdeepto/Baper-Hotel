<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Order History — Baper Hotel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <div class="brand-icon" style="width: 36px; height: 36px; font-size: 1rem;">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <span class="fw-bold text-dark">Baper Hotel</span>
    </a>
    <div class="d-flex align-items-center gap-3">
      <a href="/" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
        <i class="fa-solid fa-arrow-left me-1"></i> Food Menu
      </a>
      <div id="navbar-auth-section"></div>
    </div>
  </div>
</nav>

<div class="container py-5" style="max-width: 800px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-clock-rotate-left text-primary me-2"></i>My Order History</h3>
      <p class="text-muted small mb-0">Review all your previous food orders, receipts, and order statuses.</p>
    </div>
    <a href="/" class="btn btn-primary rounded-pill px-3 btn-sm">
      <i class="fa-solid fa-plus me-1"></i> New Order
    </a>
  </div>

  <div id="order-history-list">
    <!-- Populated by orders.js -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/assets/js/orders.js"></script>
</body>
</html>
