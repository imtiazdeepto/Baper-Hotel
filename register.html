<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Baper Hotel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container" style="max-width: 480px;">
  <!-- Brand Header -->
  <div class="text-center mb-4">
    <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none">
      <div class="brand-icon">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <h3 class="fw-bold text-dark mb-0">Baper Hotel</h3>
    </a>
    <p class="text-muted small mt-2">Join us to order food, save delivery addresses, and track meals</p>
  </div>

  <!-- Register Card -->
  <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
    <div id="register-error-alert" class="alert alert-danger small rounded-3 mb-3" style="display:none;"></div>
    <div id="register-success-alert" class="alert alert-success small rounded-3 mb-3" style="display:none;"></div>

    <form id="register-form">
      <div class="mb-3">
        <label for="reg-name" class="form-label small fw-bold text-dark">Full Name *</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="fa-regular fa-user text-muted"></i></span>
          <input type="text" id="reg-name" class="form-control border-start-0 rounded-end-3" placeholder="e.g. Imtiaz Ahmed" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="reg-email" class="form-label small fw-bold text-dark">Email Address *</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="fa-regular fa-envelope text-muted"></i></span>
          <input type="email" id="reg-email" class="form-control border-start-0 rounded-end-3" placeholder="name@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="mb-3">
        <label for="reg-phone" class="form-label small fw-bold text-dark">Phone Number (For Delivery) *</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="fa-solid fa-phone text-muted"></i></span>
          <input type="tel" id="reg-phone" class="form-control border-start-0 rounded-end-3" placeholder="01712345678" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="reg-password" class="form-label small fw-bold text-dark">Password *</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="fa-solid fa-lock text-muted"></i></span>
          <input type="password" id="reg-password" class="form-control border-start-0 border-end-0" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
          <button class="btn btn-light border border-start-0 rounded-end-3 text-muted" type="button" id="toggle-reg-pwd-btn">
            <i class="fa-regular fa-eye" id="reg-pwd-eye-icon"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label for="reg-confirm-password" class="form-label small fw-bold text-dark">Confirm Password *</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="fa-solid fa-shield-halved text-muted"></i></span>
          <input type="password" id="reg-confirm-password" class="form-control border-start-0 rounded-end-3" placeholder="Re-type password" minlength="6" required autocomplete="new-password">
        </div>
      </div>

      <button type="submit" id="reg-submit-btn" class="button button-primary w-100 py-2 rounded-pill fw-bold shadow-sm mt-3">
        <i class="fa-solid fa-user-plus me-2"></i>Create Customer Account
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <p class="small text-muted mb-0">
        Already have an account? 
        <a href="/login.html" class="text-primary fw-semibold text-decoration-none">Sign In Here</a>
      </p>
      <div class="mt-2">
        <a href="/" class="small text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i>Back to Food Menu</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { register } from '/assets/js/auth.js';
  import { checkAndDisplayConfigNotice } from '/assets/js/supabaseClient.js';

  document.addEventListener('DOMContentLoaded', () => {
    checkAndDisplayConfigNotice();

    // Toggle password visibility
    const toggleBtn = document.getElementById('toggle-reg-pwd-btn');
    const pwdInput = document.getElementById('reg-password');
    const eyeIcon = document.getElementById('reg-pwd-eye-icon');

    toggleBtn?.addEventListener('click', () => {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.className = 'fa-regular fa-eye-slash';
      } else {
        pwdInput.type = 'password';
        eyeIcon.className = 'fa-regular fa-eye';
      }
    });

    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('reg-submit-btn');
    const errorAlert = document.getElementById('register-error-alert');
    const successAlert = document.getElementById('register-success-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      if (password !== confirmPassword) {
        errorAlert.textContent = 'Passwords do not match. Please verify.';
        errorAlert.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...`;

      try {
        const result = await register({
          email,
          password,
          full_name: name,
          phone
        });

        // Check if session was created immediately (confirm email disabled in Supabase)
        if (result?.session) {
          successAlert.innerHTML = `
            <strong><i class="fa-solid fa-circle-check me-1"></i>Account created!</strong><br>
            Signing you in automatically...
          `;
          successAlert.style.display = 'block';
          form.reset();

          setTimeout(() => {
            window.location.href = '/';
          }, 1200);
        } else {
          // Email confirmation is required by Supabase project settings
          successAlert.innerHTML = `
            <strong><i class="fa-solid fa-circle-check me-1"></i>Account registered!</strong><br>
            Please check your email inbox to verify your account, or log in on the sign-in page.<br>
            <small class="text-muted mt-1 d-block">Tip: To allow instant login without email verification, turn off "Confirm email" in Supabase Auth -> Providers -> Email.</small>
          `;
          successAlert.style.display = 'block';
          form.reset();
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="fa-solid fa-user-plus me-2"></i>Create Customer Account`;
        }

      } catch (err) {
        console.error('Registration error:', err);
        errorAlert.innerHTML = `<strong>Registration Failed:</strong><br>${err.message || 'An error occurred. Please try again.'}`;
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-user-plus me-2"></i>Create Customer Account`;
      }
    });
  });
</script>
</body>
</html>
