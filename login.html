<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Baper Hotel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container" style="max-width: 440px;">
  <!-- Logo / Brand Header -->
  <div class="text-center mb-4">
    <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none">
      <div class="brand-icon">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <h3 class="fw-bold text-dark mb-0">Baper Hotel</h3>
    </a>
    <p class="text-muted small mt-2">Sign in to manage your orders or access restaurant controls</p>
  </div>

  <!-- Login Card -->
  <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
    <div id="login-error-alert" class="alert alert-danger small rounded-3 mb-3" style="display:none;"></div>

    <form id="login-form">
      <div class="mb-3">
        <label for="login-email" class="form-label small fw-bold text-dark">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="fa-regular fa-envelope text-muted"></i></span>
          <input type="email" id="login-email" class="form-control border-start-0 rounded-end-3" placeholder="name@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between">
          <label for="login-password" class="form-label small fw-bold text-dark">Password</label>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="fa-solid fa-lock text-muted"></i></span>
          <input type="password" id="login-password" class="form-control border-start-0 rounded-end-3" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm mt-3">
        <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <p class="small text-muted mb-0">
        Don't have an account? 
        <a href="/register.html" class="text-primary fw-semibold text-decoration-none">Create an Account</a>
      </p>
      <div class="mt-2">
        <a href="/" class="small text-muted text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i>Back to Menu</a>
      </div>
    </div>
  </div>

  <!-- Role info helper for university viva / evaluation -->
  <div class="mt-4 p-3 bg-white border rounded-4 shadow-sm text-center">
    <div class="small fw-bold text-muted mb-1"><i class="fa-solid fa-shield-halved text-primary me-1"></i>Role-Based Access Control:</div>
    <p class="small text-muted mb-0" style="font-size: 0.78rem;">
      • Customers: Place orders & view history.<br>
      • Staff: Manage kitchen queue.<br>
      • Admin: Full catalog, reports & coupon controls.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { login } from '/assets/js/auth.js';
  import { checkAndDisplayConfigNotice } from '/assets/js/supabaseClient.js';

  document.addEventListener('DOMContentLoaded', () => {
    checkAndDisplayConfigNotice();

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('login-submit-btn');
    const errorAlert = document.getElementById('login-error-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Signing in...`;

      try {
        const { user, profile } = await login(email, password);

        // Check redirect parameter
        const params = new URLSearchParams(window.location.search);
        const redirectParam = params.get('redirect');

        if (redirectParam) {
          window.location.href = redirectParam;
          return;
        }

        // Direct based on role
        const role = profile?.role || 'customer';
        if (role === 'admin') {
          window.location.href = '/admin/dashboard.html';
        } else if (role === 'staff') {
          window.location.href = '/staff/orders.html';
        } else {
          window.location.href = '/';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorAlert.textContent = err.message || 'Invalid email or password.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-2"></i>Sign In`;
      }
    });
  });
</script>
</body>
</html>
