<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Order Tracking — Baper Hotel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <div class="brand-icon" style="width: 36px; height: 36px; font-size: 1rem;">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <span class="fw-bold text-dark">Baper Hotel</span>
    </a>
    <div class="d-flex align-items-center gap-3">
      <a href="/" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
        <i class="fa-solid fa-arrow-left me-1"></i> Food Menu
      </a>
      <div id="navbar-auth-section"></div>
    </div>
  </div>
</nav>

<div class="container py-5" style="max-width: 850px;">
  <!-- Search Header -->
  <div class="text-center mb-4">
    <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-location-crosshairs text-primary me-2"></i>Live Order Tracker</h3>
    <p class="text-muted small">Enter your unique order number to check real-time kitchen preparation and delivery progress.</p>

    <div class="card border-0 shadow-sm rounded-4 p-3 bg-white mt-4 mx-auto" style="max-width: 550px;">
      <form id="track-search-form" class="d-flex gap-2">
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-pill"><i class="fa-solid fa-hashtag text-muted"></i></span>
          <input type="text" id="track-order-number-input" class="form-control border-start-0 rounded-end-pill text-uppercase" placeholder="e.g. ORD-20261112-AB12" required>
        </div>
        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Track</button>
      </form>
    </div>
  </div>

  <div id="tracking-error-alert" class="alert alert-danger small rounded-4 p-3 text-center mb-4" style="display:none;"></div>

  <!-- Dynamic Tracking Result Container -->
  <div id="tracking-result-container" style="display:none;">
    <!-- Populated by orders.js -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/assets/js/orders.js"></script>
</body>
</html>
