<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Shopping Cart — Baper Hotel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <div class="brand-icon" style="width: 36px; height: 36px; font-size: 1rem;">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <span class="fw-bold text-dark">Baper Hotel</span>
    </a>
    <div class="d-flex align-items-center gap-3">
      <a href="/" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
        <i class="fa-solid fa-arrow-left me-1"></i> Continue Browsing
      </a>
      <div id="navbar-auth-section"></div>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-bag-shopping text-primary me-2"></i>Shopping Cart</h4>
          <button class="btn btn-sm btn-outline-danger rounded-pill px-3" id="clear-all-cart-btn">
            <i class="fa-regular fa-trash-can me-1"></i> Clear Cart
          </button>
        </div>

        <div id="full-cart-items-container">
          <!-- Populated dynamically -->
        </div>

        <div id="full-cart-empty" class="text-center py-5" style="display:none;">
          <div class="p-4 bg-light rounded-circle d-inline-flex mb-3">
            <i class="fa-solid fa-bowl-food text-muted fs-1"></i>
          </div>
          <h5 class="fw-bold text-dark">Your cart is currently empty</h5>
          <p class="text-muted small mb-3">Explore our menu and discover appetizing stone-baked pizzas, burgers, ramen and more!</p>
          <a href="/" class="btn btn-primary rounded-pill px-4">Browse Menu</a>
        </div>
      </div>
    </div>

    <!-- Order Summary Panel -->
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm rounded-4 p-4 bg-white sticky-top" style="top: 90px;">
        <h5 class="fw-bold mb-3 text-dark">Order Summary</h5>
        
        <!-- Coupon input -->
        <div class="mb-3" id="page-coupon-section">
          <!-- Populated dynamically -->
        </div>

        <div class="d-flex justify-content-between small text-muted mb-2">
          <span>Subtotal</span>
          <span class="fw-semibold text-dark" id="page-subtotal">৳ 0.00</span>
        </div>
        <div class="d-flex justify-content-between small text-success mb-2" id="page-discount-row">
          <span>Coupon Discount</span>
          <span class="fw-semibold" id="page-discount">- ৳ 0.00</span>
        </div>
        <div class="d-flex justify-content-between small text-muted mb-3">
          <span>Delivery Charges</span>
          <span class="text-success fw-bold">FREE (Promo)</span>
        </div>
        <hr>
        <div class="d-flex justify-content-between fs-5 fw-bold text-dark mb-4">
          <span>Total Bill</span>
          <span class="text-primary" id="page-total">৳ 0.00</span>
        </div>

        <a href="/checkout.html" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2" id="cart-to-checkout-btn">
          <span>Proceed to Checkout</span>
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { getCart, updateQuantity, removeFromCart, clearCart, calculateTotals, formatCurrency, applyCoupon, setAppliedCoupon } from '/assets/js/cart.js';
  import { setupAuthNav } from '/assets/js/auth.js';
  import { checkAndDisplayConfigNotice } from '/assets/js/supabaseClient.js';
  import { escapeHtml, getSafeImageUrl } from '/assets/js/appLogic.js';

  document.addEventListener('DOMContentLoaded', async () => {
    checkAndDisplayConfigNotice();
    await setupAuthNav();
    renderPageCart();

    window.addEventListener('cart-updated', renderPageCart);

    document.getElementById('clear-all-cart-btn')?.addEventListener('click', () => {
      if (confirm('Are you sure you want to remove all items from your cart?')) {
        clearCart();
      }
    });
  });

  function renderPageCart() {
    const items = getCart();
    const container = document.getElementById('full-cart-items-container');
    const emptyBox = document.getElementById('full-cart-empty');
    const checkoutBtn = document.getElementById('cart-to-checkout-btn');
    const { subtotal, discount, total, coupon } = calculateTotals();

    if (items.length === 0) {
      if (container) container.innerHTML = '';
      if (emptyBox) emptyBox.style.display = 'block';
      if (checkoutBtn) {
        checkoutBtn.classList.add('disabled');
        checkoutBtn.setAttribute('aria-disabled', 'true');
        checkoutBtn.setAttribute('tabindex', '-1');
      }
      document.getElementById('page-subtotal').textContent = '৳ 0.00';
      document.getElementById('page-discount').textContent = '৳ 0.00';
      document.getElementById('page-total').textContent = '৳ 0.00';
      return;
    }

    if (emptyBox) emptyBox.style.display = 'none';
    if (checkoutBtn) {
      checkoutBtn.classList.remove('disabled');
      checkoutBtn.removeAttribute('aria-disabled');
      checkoutBtn.removeAttribute('tabindex');
    }

    container.innerHTML = items.map(item => `
      <div class="d-flex align-items-center justify-content-between p-3 mb-3 bg-light rounded-3 border">
        <div class="d-flex align-items-center gap-3">
          <img src="${escapeHtml(getSafeImageUrl(item.image_url, 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=120&q=80'))}" alt="${escapeHtml(item.name)}" class="rounded-3" style="width: 70px; height: 70px; object-fit: cover;">
          <div>
            <h6 class="fw-bold mb-1 text-dark">${escapeHtml(item.name)}</h6>
            <div class="text-primary fw-bold small">${formatCurrency(item.price)} each</div>
          </div>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="quantity-stepper d-flex align-items-center bg-white rounded-pill border px-2 py-1">
            <button class="btn btn-sm p-0 border-0 minus-btn" data-id="${escapeHtml(item.id)}"><i class="fa-solid fa-minus fs-xs"></i></button>
            <span class="px-3 fw-bold small">${item.quantity}</span>
            <button class="btn btn-sm p-0 border-0 plus-btn" data-id="${escapeHtml(item.id)}"><i class="fa-solid fa-plus fs-xs"></i></button>
          </div>
          <div class="fw-bold text-dark" style="min-width: 80px; text-align: right;">${formatCurrency(item.price * item.quantity)}</div>
          <button class="btn btn-sm text-danger border-0 remove-btn" data-id="${escapeHtml(item.id)}"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      </div>
    `).join('');

    container.querySelectorAll('.minus-btn').forEach(b => b.addEventListener('click', () => {
      const id = b.getAttribute('data-id');
      const item = items.find(i => i.id === id);
      if (item) updateQuantity(id, item.quantity - 1);
    }));

    container.querySelectorAll('.plus-btn').forEach(b => b.addEventListener('click', () => {
      const id = b.getAttribute('data-id');
      const item = items.find(i => i.id === id);
      if (item) updateQuantity(id, item.quantity + 1);
    }));

    container.querySelectorAll('.remove-btn').forEach(b => b.addEventListener('click', () => {
      removeFromCart(b.getAttribute('data-id'));
    }));

    document.getElementById('page-subtotal').textContent = formatCurrency(subtotal);
    document.getElementById('page-discount').textContent = discount > 0 ? `- ${formatCurrency(discount)}` : formatCurrency(0);
    document.getElementById('page-total').textContent = formatCurrency(total);

    // Coupon UI
    const couponBox = document.getElementById('page-coupon-section');
    if (coupon) {
      couponBox.innerHTML = `
        <div class="d-flex align-items-center justify-content-between p-2 bg-success-subtle text-success border border-success-subtle rounded-3">
          <span class="small fw-bold"><i class="fa-solid fa-circle-check me-1"></i>${escapeHtml(coupon.code)}: Saved ${formatCurrency(discount)}</span>
          <button class="btn btn-sm btn-link text-danger p-0 text-decoration-none small fw-semibold" id="page-rem-coupon">Remove</button>
        </div>
      `;
      document.getElementById('page-rem-coupon')?.addEventListener('click', () => setAppliedCoupon(null));
    } else {
      couponBox.innerHTML = `
        <div class="input-group input-group-sm mb-2">
          <input type="text" id="page-coupon-input" class="form-control rounded-start-pill text-uppercase" placeholder="e.g. WELCOME10">
          <button class="btn btn-dark rounded-end-pill px-3" id="page-apply-coupon-btn">Apply</button>
        </div>
        <div id="page-coupon-error" class="text-danger small mb-2" style="display:none;"></div>
        <div class="d-flex flex-wrap gap-1 align-items-center">
          <span class="text-muted small" style="font-size:0.75rem;">Try:</span>
          <button type="button" class="badge bg-light text-dark border rounded-pill py-1 px-2 page-quick-coupon" data-code="WELCOME10">WELCOME10 (10% off)</button>
          <button type="button" class="badge bg-light text-dark border rounded-pill py-1 px-2 page-quick-coupon" data-code="SUPER50">SUPER50 (৳50 off)</button>
          <button type="button" class="badge bg-light text-dark border rounded-pill py-1 px-2 page-quick-coupon" data-code="RAMEN15">RAMEN15 (15% off)</button>
        </div>
      `;

      const input = document.getElementById('page-coupon-input');
      const applyBtn = document.getElementById('page-apply-coupon-btn');
      const errorEl = document.getElementById('page-coupon-error');

      const triggerApply = async (codeToApply) => {
        const c = (codeToApply || input?.value || '').trim();
        if (!c) return;
        if (errorEl) errorEl.style.display = 'none';
        applyBtn.disabled = true;
        applyBtn.innerHTML = `<span class="spinner-border spinner-border-sm"></span>`;

        try {
          await applyCoupon(c);
        } catch (err) {
          if (errorEl) {
            errorEl.textContent = err.message || 'Coupon not valid for this cart.';
            errorEl.style.display = 'block';
          } else {
            alert(err.message);
          }
        } finally {
          applyBtn.disabled = false;
          applyBtn.innerHTML = 'Apply';
        }
      };

      applyBtn?.addEventListener('click', () => triggerApply());
      input?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          triggerApply();
        }
      });

      document.querySelectorAll('.page-quick-coupon').forEach(badge => {
        badge.onclick = () => {
          const code = badge.getAttribute('data-code');
          if (input) input.value = code;
          triggerApply(code);
        };
      });
    }
  }
</script>
</body>
</html>
